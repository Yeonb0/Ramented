spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:ramentaku}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 Flyway (db/migration) 가 만든다. 엔티티와 어긋나면 기동 시 실패시켜 바로 드러낸다
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # 영업 상태 계산 기준 시각대 (breadboard N4)
  zone: Asia/Seoul
