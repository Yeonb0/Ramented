spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:ramentaku}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  seed:
    # 시드는 db/seed/*.sql 로 단일화. DataSeeder 는 스키마 초기화 직후에만 켠다.
    enabled: false
